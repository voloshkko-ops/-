<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>àbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; }

/* ═══════════════════════════
   LOADER
═══════════════════════════ */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

#lc {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: max(48px, 9vh);
  gap: 6px;
  position: relative;
  z-index: 2;
}

#la {
  font-family: 'Inter', sans-serif;
  font-size: clamp(80px, 16vw, 150px);
  font-weight: 800;
  color: #22c55e;
  line-height: 1;
  letter-spacing: -3px;
  text-shadow: 0 0 30px rgba(34,197,94,0.8), 0 0 80px rgba(34,197,94,0.3);
}

#lw {
  font-family: 'Inter', sans-serif;
  font-size: clamp(10px, 1.4vw, 14px);
  font-weight: 500;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(34,197,94,0.65);
}

#lp {
  font-family: 'Inter', sans-serif;
  font-size: clamp(14px, 2vw, 18px);
  font-weight: 700;
  letter-spacing: 5px;
  color: #22c55e;
  text-shadow: 0 0 14px rgba(34,197,94,0.9);
  margin-top: 2px;
}

/* Paint drip container — positioned by JS right below text */
#drip-wrap {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  width: min(480px, 88vw);
  pointer-events: none;
}

#drip-svg {
  width: 100%;
  overflow: visible;
  display: block;
}

/* ═══════════════════════════
   SPLASH
═══════════════════════════ */
#splash {
  position: fixed; inset: 0; z-index: 8888;
  pointer-events: none;
  background: #020602;
  clip-path: circle(0% at 50% 50%);
}
#splash.go {
  animation: splashGo 0.75s cubic-bezier(0.55,0,0.1,1) forwards;
}
@keyframes splashGo { to { clip-path: circle(150% at 50% 50%); } }

/* ═══════════════════════════
   MAIN PAGE
═══════════════════════════ */
#main {
  position: fixed; inset: 0; z-index: 1;
  opacity: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;
}
#main.on { opacity: 1; }

#s1 {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 24px 60px;
  position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 65% 85% at 2%  98%, rgba(0,100,22,0.6)  0%, transparent 52%),
    radial-gradient(ellipse 55% 75% at 98% 2%,  rgba(0,80,18,0.5)   0%, transparent 52%),
    radial-gradient(ellipse 45% 65% at 98% 98%, rgba(0,60,12,0.35)  0%, transparent 48%),
    radial-gradient(ellipse 35% 55% at 2%  2%,  rgba(0,50,10,0.3)   0%, transparent 48%),
    #020602;
}
#s1::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(135deg, rgba(0,120,28,0.08) 0%, transparent 40%),
    linear-gradient(315deg, rgba(0,90,18,0.06)  0%, transparent 40%);
}
#s1::after {
  content:''; position:absolute; inset:-20%; pointer-events:none;
  background: radial-gradient(ellipse 30% 30% at 50% 50%, rgba(26,122,60,0.07) 0%, transparent 70%);
  animation: breathe 5s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{transform:scale(1);opacity:.6;} 50%{transform:scale(1.1);opacity:1;} }

.main-logo {
  position: relative; z-index: 2;
  display: inline-flex; align-items: baseline;
  font-family: 'Inter', sans-serif;
  font-size: clamp(56px,12vw,140px);
  font-weight: 800; letter-spacing: -2px;
  cursor: default; user-select: none;
  opacity: 0; transform: translateY(24px);
}
.main-logo.in { animation: riseIn 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }

.logo-glow {
  position: absolute; top:50%; left:50%;
  transform: translate(-50%,-50%);
  width: 130%; height: 160%;
  background: radial-gradient(ellipse 55% 55% at 50% 50%,
    rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.07) 40%, transparent 70%);
  pointer-events: none; z-index: -1; border-radius: 50%;
}
.ml-a-wrap { position:relative; display:inline-flex; flex-direction:column; align-items:center; }
.ml-tick {
  position:absolute; top:-0.08em; left:50%; transform:translateX(-46%);
  width:0.44em; overflow:visible; pointer-events:none;
  filter: drop-shadow(0 0 6px rgba(34,197,94,0.7));
}
.ml-tick path {
  stroke:#22c55e; stroke-width:3.5;
  stroke-linecap:round; stroke-linejoin:round; fill:none;
  animation: tickFloat 2.6s ease-in-out infinite; transform-origin: 50% 50%;
}
@keyframes tickFloat {
  0%,100%{transform:translateY(0) rotate(0deg);}
  25%{transform:translateY(-4px) rotate(-4deg);}
  50%{transform:translateY(-2px) rotate(3deg);}
  75%{transform:translateY(-5px) rotate(-2deg);}
}
.ml-a-letter {
  color:#22c55e;
  text-shadow:0 0 20px rgba(34,197,94,.55),0 0 50px rgba(34,197,94,.25);
  transition:text-shadow .3s;
}
.ml-bank {
  color:#000;
  text-shadow:0 0 2px rgba(255,255,255,.95),0 0 12px rgba(255,255,255,.7),0 0 30px rgba(255,255,255,.35);
  transition:text-shadow .3s;
}
.main-logo:hover .ml-a-letter { text-shadow:0 0 25px rgba(34,197,94,.8),0 0 60px rgba(34,197,94,.4); }
.main-logo:hover .ml-bank { text-shadow:0 0 2px #fff,0 0 20px rgba(255,255,255,.9),0 0 50px rgba(255,255,255,.5); }

.tagline {
  position:relative;z-index:2;
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(12px,1.6vw,16px);font-weight:300;
  letter-spacing:5px;text-transform:uppercase;
  color:rgba(255,255,255,.4);margin-top:10px;
  cursor:default;transition:color .3s,text-shadow .3s;
  opacity:0;transform:translateY(10px);
}
.tagline:hover{color:rgba(255,255,255,.8);text-shadow:0 0 16px rgba(255,255,255,.2);}
.tagline.in{animation:riseIn .85s cubic-bezier(.22,1,.36,1) .3s forwards;}

.subtitle-block {
  position:relative;z-index:2;
  max-width:740px;text-align:center;
  margin-top:48px;padding:0 16px;
  opacity:0;transform:translateY(24px);
}
.subtitle-block.in{animation:riseIn .85s cubic-bezier(.22,1,.36,1) .5s forwards;}

@keyframes riseIn{to{opacity:1;transform:translateY(0);}}

.subtitle-text{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(13px,1.8vw,17px);font-weight:300;
  color:rgba(255,255,255,.75);line-height:1.8;
  cursor:default;transition:color .35s,text-shadow .35s;
}
.subtitle-text:hover{color:rgba(255,255,255,1);text-shadow:0 0 18px rgba(255,255,255,.22);}
.subtitle-text .hl{color:#4ade80;font-weight:500;}
.subtitle-text:hover .hl{text-shadow:0 0 14px rgba(74,222,128,.6);}

.divider{width:48px;height:1px;background:linear-gradient(90deg,transparent,rgba(34,197,94,.5),transparent);margin:28px auto;}
.author{
  font-family:'Inter',sans-serif;font-size:clamp(11px,1.4vw,14px);
  font-weight:400;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.3);cursor:default;transition:color .3s,text-shadow .3s;
}
.author:hover{color:rgba(255,255,255,.65);text-shadow:0 0 16px rgba(255,255,255,.18);}

.scroll-hint{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:0;animation:fadeH 1s ease 1.2s forwards;
}
@keyframes fadeH{to{opacity:.3;}}
.scroll-hint span{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:4px;color:#22c55e;text-transform:uppercase;}
.sh-line{width:1px;height:28px;background:linear-gradient(to bottom,rgba(34,197,94,.8),transparent);animation:shPulse 1.6s ease-in-out infinite;}
@keyframes shPulse{0%,100%{transform:scaleY(1);opacity:1;}50%{transform:scaleY(.5) translateY(6px);opacity:.4;}}

#s2{min-height:100vh;background:#020602;}
</style>
</head>
<body>

<div id="splash"></div>

<!-- LOADER -->
<div id="loader">
  <div id="lc">
    <span id="la">à</span>
    <span id="lw">завантаження</span>
    <span id="lp">0%</span>
  </div>

  <!-- SVG paint drips — positioned by JS -->
  <div id="drip-wrap">
    <svg id="drip-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="drip-glow" x="-30%" y="-10%" width="160%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="drip-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#1aaa50"/>
          <stop offset="35%"  stop-color="#22c55e"/>
          <stop offset="65%"  stop-color="#22c55e"/>
          <stop offset="100%" stop-color="#16943f"/>
        </linearGradient>
        <!-- highlight shimmer -->
        <linearGradient id="drip-hi" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
          <stop offset="30%"  stop-color="rgba(255,255,255,0.22)"/>
          <stop offset="60%"  stop-color="rgba(255,255,255,0.1)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>
      </defs>
      <!-- wave base + drips drawn by JS -->
    </svg>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <section id="s1">
    <div class="main-logo" id="main-logo">
      <div class="logo-glow"></div>
      <span class="ml-a-wrap">
        <svg class="ml-tick" viewBox="0 0 36 22" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12 L12 20 L32 4"/>
        </svg>
        <span class="ml-a-letter">a</span>
      </span>
      <span class="ml-bank">bank</span>
    </div>
    <p class="tagline" id="tagline">цінуємо стосунки</p>
    <div class="subtitle-block" id="sub-block">
      <p class="subtitle-text">
        Шукаємо тих, хто <span class="hl">«поза зоною комфорту»</span>:<br>
        Потрібно прорахувати <span class="hl">% SL ASA</span> для всієї команди за період.<br>
        Фінальна мета&nbsp;— сформувати список <span class="hl">(ПІБ&nbsp;+&nbsp;LDAP)</span> операторів,
        які не дотягнули до таргету в&nbsp;<span class="hl">65%</span>.
      </p>
      <div class="divider"></div>
      <p class="author">Підготувала Волошко Ульяна</p>
    </div>
    <div class="scroll-hint"><span>scroll</span><div class="sh-line"></div></div>
  </section>
  <section id="s2"></section>
</div>

<script>
(function(){
  const splash    = document.getElementById('splash');
  const mainEl    = document.getElementById('main');
  const mainLogo  = document.getElementById('main-logo');
  const subBlock  = document.getElementById('sub-block');
  const taglineEl = document.getElementById('tagline');
  const loaderEl  = document.getElementById('loader');
  const lcEl      = document.getElementById('lc');
  const dripWrap  = document.getElementById('drip-wrap');
  const dripSvg   = document.getElementById('drip-svg');
  const lpEl      = document.getElementById('lp');

  // SVG viewport width
  const SVG_W = 480;

  // Drip definitions: x center, width, max height, stagger delay (0-25%)
  const DRIPS = [
    { x: 48,  w: 22, maxH: 220, delay: 0  },
    { x: 108, w: 30, maxH: 280, delay: 8  },
    { x: 178, w: 18, maxH: 195, delay: 15 },
    { x: 238, w: 26, maxH: 260, delay: 4  },
    { x: 298, w: 20, maxH: 240, delay: 20 },
    { x: 362, w: 28, maxH: 270, delay: 11 },
    { x: 422, w: 16, maxH: 180, delay: 6  },
  ];

  // Wave base height (the wavy paint mass at top)
  const WAVE_H = 52;

  // Build SVG: wave base + drip stems + teardrops
  dripSvg.setAttribute('viewBox', '0 0 ' + SVG_W + ' 380');
  dripSvg.setAttribute('height', '380');

  // Wave path (organic wavy bottom edge)
  const wavePath = document.createElementNS('http://www.w3.org/2000/svg','path');
  const wp = [
    'M0,0',
    'L' + SVG_W + ',0',
    'L' + SVG_W + ',' + (WAVE_H - 8),
    'C' + (SVG_W*0.88) + ',' + (WAVE_H+14) + ' ' + (SVG_W*0.78) + ',' + (WAVE_H-10) + ' ' + (SVG_W*0.68) + ',' + (WAVE_H+8),
    'C' + (SVG_W*0.58) + ',' + (WAVE_H+22) + ' ' + (SVG_W*0.5) + ',' + (WAVE_H-6) + ' ' + (SVG_W*0.42) + ',' + (WAVE_H+12),
    'C' + (SVG_W*0.32) + ',' + (WAVE_H+26) + ' ' + (SVG_W*0.22) + ',' + (WAVE_H-8) + ' ' + (SVG_W*0.12) + ',' + (WAVE_H+10),
    'C' + (SVG_W*0.06) + ',' + (WAVE_H+18) + ' 0,' + (WAVE_H+4) + ' 0,' + (WAVE_H+4),
    'Z'
  ].join(' ');
  wavePath.setAttribute('d', wp);
  wavePath.setAttribute('fill', 'url(#drip-grad)');
  wavePath.setAttribute('filter', 'url(#drip-glow)');
  dripSvg.appendChild(wavePath);

  // Wave highlight
  const waveHi = document.createElementNS('http://www.w3.org/2000/svg','rect');
  waveHi.setAttribute('x','0'); waveHi.setAttribute('y','0');
  waveHi.setAttribute('width', SVG_W); waveHi.setAttribute('height', '18');
  waveHi.setAttribute('fill','url(#drip-hi)');
  dripSvg.appendChild(waveHi);

  // Create drip elements
  const stemEls = [];
  const dropEls = [];

  DRIPS.forEach((d, i) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');

    // Stem rectangle (starts at wave bottom, height=0, grows down)
    const stem = document.createElementNS('http://www.w3.org/2000/svg','rect');
    const sx = d.x - d.w/2;
    stem.setAttribute('x', sx);
    stem.setAttribute('y', WAVE_H + 12);
    stem.setAttribute('width', d.w);
    stem.setAttribute('height', '0');
    stem.setAttribute('fill', 'url(#drip-grad)');
    stem.setAttribute('rx', d.w/2);

    // Stem highlight
    const stemHi = document.createElementNS('http://www.w3.org/2000/svg','rect');
    stemHi.setAttribute('x', sx + d.w*0.2);
    stemHi.setAttribute('y', WAVE_H + 12);
    stemHi.setAttribute('width', d.w * 0.28);
    stemHi.setAttribute('height', '0');
    stemHi.setAttribute('fill', 'rgba(255,255,255,0.2)');
    stemHi.setAttribute('rx', d.w*0.14);

    // Teardrop at bottom of stem
    const tw = d.w * 2.0;
    const th = d.w * 2.6;
    // Teardrop SVG path centered at (d.x, WAVE_H + 12 + currentH + th/2)
    const drop = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    drop.setAttribute('cx', d.x);
    drop.setAttribute('cy', WAVE_H + 12);
    drop.setAttribute('rx', tw/2);
    drop.setAttribute('ry', th/2);
    drop.setAttribute('fill', 'url(#drip-grad)');
    drop.setAttribute('opacity', '0');

    // Teardrop highlight
    const dropHi = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    dropHi.setAttribute('cx', d.x - tw*0.12);
    dropHi.setAttribute('cy', WAVE_H + 12);
    dropHi.setAttribute('rx', tw*0.18);
    dropHi.setAttribute('ry', th*0.28);
    dropHi.setAttribute('fill', 'rgba(255,255,255,0.25)');
    dropHi.setAttribute('opacity', '0');

    g.appendChild(stem);
    g.appendChild(stemHi);
    g.appendChild(drop);
    g.appendChild(dropHi);
    dripSvg.appendChild(g);

    stemEls.push({ stem, stemHi, drop, dropHi, d });
  });

  // Position drip-wrap right below text block
  function positionDrips() {
    const r = lcEl.getBoundingClientRect();
    dripWrap.style.top = (r.bottom + 6) + 'px';
  }
  positionDrips();

  function update(pct) {
    lpEl.textContent = pct + '%';

    stemEls.forEach(({ stem, stemHi, drop, dropHi, d }) => {
      const p = Math.max(0, pct - d.delay);
      const t = p / (100 - d.delay);
      // Ease-in: slow start, faster as it grows (like gravity)
      const ease = t * t;
      const h = d.maxH * ease;

      const baseY = WAVE_H + 12;

      stem.setAttribute('height', h);
      stemHi.setAttribute('height', h);
      stemHi.setAttribute('y', baseY);

      const tw = d.w * 2.0;
      const th = d.w * 2.6;
      const dropCY = baseY + h + th * 0.5;

      drop.setAttribute('cy', dropCY);
      drop.setAttribute('opacity', h > 8 ? '1' : '0');

      dropHi.setAttribute('cy', dropCY - th*0.1);
      dropHi.setAttribute('opacity', h > 8 ? '1' : '0');
    });
  }

  update(0);

  const STEPS = 200, IV = 5000 / STEPS;
  let step = 0;
  const timer = setInterval(() => {
    step++;
    const pct = Math.min(Math.round(step / STEPS * 100), 100);
    update(pct);
    if (pct >= 100) {
      clearInterval(timer);
      doSplash();
    }
  }, IV);

  function doSplash() {
    lcEl.style.display     = 'none';
    dripWrap.style.display = 'none';
    mainEl.classList.add('on');
    splash.classList.add('go');
    splash.addEventListener('animationend', () => {
      loaderEl.style.display = 'none';
      splash.style.display   = 'none';
      mainLogo.classList.add('in');
      if (taglineEl) taglineEl.classList.add('in');
      subBlock.classList.add('in');
    }, { once: true });
  }
})();
</script>
</body>
</html>
