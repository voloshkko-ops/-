<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>àbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body { width:100%; height:100%; overflow:hidden; background:#000; }

/* ═══════════════════════════
   LOADER
═══════════════════════════ */
#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #fff;
  overflow: hidden;
}

/* % counter */
#pct-label {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20;
  font-family: 'Inter', sans-serif;
  font-size: clamp(14px, 2.5vw, 20px);
  font-weight: 600;
  letter-spacing: 5px;
  color: rgba(0,0,0,0.25);
  pointer-events: none;
  mix-blend-mode: multiply;
}

/* Paint streams container */
#paint {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

/* Each stream falls from top */
.stream {
  position: absolute;
  top: -60px;
  transform-origin: top center;
  border-radius: 0 0 45% 45% / 0 0 60% 60%;
  animation: fall var(--dur) cubic-bezier(0.25, 0.46, 0.45, 0.94) var(--delay) both;
}

@keyframes fall {
  0%   { height: 0px;          opacity: 1; width: var(--w); }
  40%  { height: 40vh;         opacity: 1; width: calc(var(--w) * 1.15); }
  100% { height: calc(100vh + 80px); opacity: 1; width: calc(var(--w) * 1.4); }
}

/* Spread pools at bottom */
.pool {
  position: absolute;
  bottom: -30px;
  height: 0;
  border-radius: 50% 50% 0 0 / 80% 80% 0 0;
  animation: pool-grow var(--pdur) ease-out var(--pdelay) both;
}

@keyframes pool-grow {
  0%   { height: 0;   width: var(--pw); opacity:1; }
  100% { height: 20vh; width: calc(var(--pw) * 2.5); opacity:1; }
}

/* Splash drips */
.splash-drip {
  position: absolute;
  border-radius: 50%;
  animation: drip-fly var(--sd) ease-out var(--sdelay) both;
}

@keyframes drip-fly {
  0%   { transform: translate(0,0) scale(1); opacity:1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(var(--ds)); opacity:0.7; }
}

/* ═══════════════════════════
   SPLASH TRANSITION
═══════════════════════════ */
#splash {
  position: fixed;
  inset: 0;
  z-index: 8888;
  pointer-events: none;
  background: #020602;
  clip-path: circle(0% at 50% 50%);
}

#splash.go {
  animation: splashGo 0.8s cubic-bezier(0.55,0,0.1,1) forwards;
}

@keyframes splashGo {
  to { clip-path: circle(150% at 50% 50%); }
}

/* ═══════════════════════════
   MAIN PAGE
═══════════════════════════ */
#main {
  position: fixed;
  inset: 0;
  z-index: 1;
  opacity: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

#main.on { opacity: 1; }

/* Section 1 */
#s1 {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px 60px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse 65% 85% at 2%  98%, rgba(0,100,22,0.6)  0%, transparent 52%),
    radial-gradient(ellipse 55% 75% at 98% 2%,  rgba(0,80,18,0.5)   0%, transparent 52%),
    radial-gradient(ellipse 45% 65% at 98% 98%, rgba(0,60,12,0.35)  0%, transparent 48%),
    radial-gradient(ellipse 35% 55% at 2%  2%,  rgba(0,50,10,0.3)   0%, transparent 48%),
    #020602;
}

#s1::before {
  content:'';
  position:absolute; inset:0;
  background:
    linear-gradient(135deg, rgba(0,120,28,0.08) 0%, transparent 40%),
    linear-gradient(315deg, rgba(0,90,18,0.06) 0%, transparent 40%);
  pointer-events:none;
}

#s1::after {
  content:'';
  position:absolute; inset:-20%;
  background: radial-gradient(ellipse 30% 30% at 50% 50%, rgba(26,122,60,0.07) 0%, transparent 70%);
  animation: breathe 5s ease-in-out infinite;
  pointer-events:none;
}

@keyframes breathe {
  0%,100% { transform:scale(1); opacity:0.6; }
  50%      { transform:scale(1.1); opacity:1; }
}

/* Logo */
.main-logo {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: baseline;
  font-family: 'Inter', sans-serif;
  font-size: clamp(56px, 12vw, 140px);
  font-weight: 800;
  letter-spacing: -2px;
  cursor: default;
  user-select: none;
}

.logo-glow {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 130%; height: 160%;
  background: radial-gradient(ellipse 55% 55% at 50% 50%,
    rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.07) 40%, transparent 70%);
  pointer-events: none;
  z-index: -1;
  border-radius: 50%;
}

.ml-a-wrap {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
}

.ml-tick {
  position: absolute;
  top: -0.08em;
  left: 50%;
  transform: translateX(-46%);
  width: 0.44em;
  overflow: visible;
  pointer-events: none;
  filter: drop-shadow(0 0 6px rgba(34,197,94,0.7));
}

.ml-tick path {
  stroke: #22c55e;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  animation: tickFloat 2.6s ease-in-out infinite;
  transform-origin: 50% 50%;
}

@keyframes tickFloat {
  0%,100% { transform:translateY(0px) rotate(0deg); }
  25%     { transform:translateY(-4px) rotate(-4deg); }
  50%     { transform:translateY(-2px) rotate(3deg); }
  75%     { transform:translateY(-5px) rotate(-2deg); }
}

.ml-a-letter {
  color: #22c55e;
  text-shadow: 0 0 20px rgba(34,197,94,0.55), 0 0 50px rgba(34,197,94,0.25);
  transition: text-shadow 0.3s;
}

.ml-bank {
  color: #000;
  text-shadow:
    0 0 2px rgba(255,255,255,0.95),
    0 0 12px rgba(255,255,255,0.7),
    0 0 30px rgba(255,255,255,0.35);
  transition: text-shadow 0.3s;
}

.main-logo:hover .ml-a-letter {
  text-shadow: 0 0 25px rgba(34,197,94,0.8), 0 0 60px rgba(34,197,94,0.4);
}

.main-logo:hover .ml-bank {
  text-shadow: 0 0 2px #fff, 0 0 20px rgba(255,255,255,0.9), 0 0 50px rgba(255,255,255,0.5);
}

/* Tagline */
.tagline {
  position: relative; z-index: 2;
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(12px, 1.6vw, 16px);
  font-weight: 300;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-top: 10px;
  cursor: default;
  transition: color 0.3s, text-shadow 0.3s;
  opacity: 0; transform: translateY(10px);
}

.tagline:hover { color:rgba(255,255,255,0.8); text-shadow:0 0 16px rgba(255,255,255,0.2); }
.tagline.in { animation: riseIn 0.85s cubic-bezier(0.22,1,0.36,1) 0.45s forwards; }

/* Subtitle */
.subtitle-block {
  position: relative; z-index: 2;
  max-width: 740px;
  text-align: center;
  margin-top: 52px;
  padding: 0 16px;
  opacity: 0; transform: translateY(24px);
}

.subtitle-block.in { animation: riseIn 0.85s cubic-bezier(0.22,1,0.36,1) 0.3s forwards; }

.subtitle-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(13px, 1.8vw, 17px);
  font-weight: 300;
  color: rgba(255,255,255,0.75);
  line-height: 1.8;
  cursor: default;
  transition: color 0.35s, text-shadow 0.35s;
}

.subtitle-text:hover {
  color: rgba(255,255,255,1);
  text-shadow: 0 0 18px rgba(255,255,255,0.22), 0 0 40px rgba(255,255,255,0.1);
}

.subtitle-text .hl { color:#4ade80; font-weight:500; transition:text-shadow 0.35s; }
.subtitle-text:hover .hl { text-shadow:0 0 14px rgba(74,222,128,0.6); }

.divider {
  width:48px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(34,197,94,0.5),transparent);
  margin:28px auto;
}

.author {
  font-family:'Inter',sans-serif;
  font-size:clamp(11px,1.4vw,14px);
  font-weight:400; letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.3);
  cursor:default;
  transition:color 0.3s, text-shadow 0.3s;
}

.author:hover { color:rgba(255,255,255,0.65); text-shadow:0 0 16px rgba(255,255,255,0.18); }

/* Reveal */
.main-logo { opacity:0; transform:translateY(24px); }
.main-logo.in { animation: riseIn 0.85s cubic-bezier(0.22,1,0.36,1) 0.1s forwards; }

@keyframes riseIn { to { opacity:1; transform:translateY(0); } }

/* Scroll hint */
.scroll-hint {
  position:absolute; bottom:28px; left:50%;
  transform:translateX(-50%); z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  opacity:0; animation:fadeH 1s ease 1.2s forwards;
}

@keyframes fadeH { to { opacity:0.3; } }

.scroll-hint span {
  font-family:'Inter',sans-serif; font-size:9px;
  letter-spacing:4px; color:#22c55e; text-transform:uppercase;
}

.sh-line {
  width:1px; height:28px;
  background:linear-gradient(to bottom,rgba(34,197,94,0.8),transparent);
  animation:shPulse 1.6s ease-in-out infinite;
}

@keyframes shPulse {
  0%,100% { transform:scaleY(1); opacity:1; }
  50%      { transform:scaleY(0.5) translateY(6px); opacity:0.4; }
}

#s2 { min-height:100vh; background:#020602; }
</style>
</head>
<body>

<div id="splash"></div>

<!-- LOADER -->
<div id="loader">
  <div id="paint"></div>
  <div id="pct-label">0%</div>
</div>

<!-- MAIN -->
<div id="main">
  <section id="s1">
    <div class="main-logo" id="main-logo">
      <div class="logo-glow"></div>
      <span class="ml-a-wrap">
        <svg class="ml-tick" viewBox="0 0 36 22" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12 L12 20 L32 4"/>
        </svg>
        <span class="ml-a-letter">a</span>
      </span>
      <span class="ml-bank">bank</span>
    </div>
    <p class="tagline" id="tagline">цінуємо стосунки</p>

    <div class="subtitle-block" id="sub-block">
      <p class="subtitle-text">
        Шукаємо тих, хто <span class="hl">«поза зоною комфорту»</span>:<br>
        Потрібно прорахувати <span class="hl">% SL ASA</span> для всієї команди за період.<br>
        Фінальна мета&nbsp;— сформувати список <span class="hl">(ПІБ&nbsp;+&nbsp;LDAP)</span> операторів,
        які не дотягнули до таргету в&nbsp;<span class="hl">65%</span>.
      </p>
      <div class="divider"></div>
      <p class="author">Підготувала Волошко Ульяна</p>
    </div>

    <div class="scroll-hint">
      <span>scroll</span>
      <div class="sh-line"></div>
    </div>
  </section>
  <section id="s2"></section>
</div>

<script>
(function(){
  const paintEl  = document.getElementById('paint');
  const pctLabel = document.getElementById('pct-label');
  const splash   = document.getElementById('splash');
  const mainEl   = document.getElementById('main');
  const mainLogo = document.getElementById('main-logo');
  const subBlock = document.getElementById('sub-block');
  const taglineEl= document.getElementById('tagline');
  const loaderEl = document.getElementById('loader');

  const COLORS = [
    '#000e03','#001408','#001a06','#000a02',
    '#002010','#001005','#001808','#000802',
    '#002508','#001204','#000f04','#001a0a',
  ];

  function rnd(a,b){ return Math.random()*(b-a)+a; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const TOTAL = 5000; // ms

  // ── Build paint streams ──
  // We pre-build all streams with CSS animations staggered over 5s
  // So browser handles it natively — zero JS frame-by-frame = no freeze

  const STREAM_COUNT = 22;
  const streams = [];

  for(let i = 0; i < STREAM_COUNT; i++){
    const el = document.createElement('div');
    el.className = 'stream';

    const x     = rnd(-30, vw + 30);
    const w     = rnd(60, vw * 0.22);
    const dur   = rnd(1.8, 3.5);   // how long stream takes to fall
    const delay = rnd(0, 3.2);     // stagger start across 5s

    el.style.cssText = `
      left: ${x - w/2}px;
      --w: ${w}px;
      --dur: ${dur}s;
      --delay: ${delay}s;
      background: ${pick(COLORS)};
    `;
    paintEl.appendChild(el);
    streams.push({ delay, dur, x, w });
  }

  // ── Bottom pools (paint spreading at floor) ──
  const POOL_COUNT = 14;
  for(let i = 0; i < POOL_COUNT; i++){
    const el = document.createElement('div');
    el.className = 'pool';
    const pw    = rnd(80, vw * 0.3);
    const px    = rnd(-40, vw + 40);
    const pdelay= rnd(1.5, 4.0);
    const pdur  = rnd(1.0, 2.5);

    el.style.cssText = `
      left: ${px - pw/2}px;
      --pw: ${pw}px;
      --pdelay: ${pdelay}s;
      --pdur: ${pdur}s;
      background: ${pick(COLORS)};
    `;
    paintEl.appendChild(el);
  }

  // ── Splash drips flying off streams ──
  for(let i = 0; i < 30; i++){
    const el = document.createElement('div');
    el.className = 'splash-drip';
    const size   = rnd(6, 28);
    const sx     = rnd(0, vw);
    const sy     = rnd(vh*0.3, vh);
    const delay  = rnd(1.2, 4.5);
    const dx     = rnd(-120, 120);
    const dy     = rnd(-80, 60);
    const ds     = rnd(0.3, 1.2);

    el.style.cssText = `
      left: ${sx}px; top: ${sy}px;
      width: ${size}px; height: ${size}px;
      background: ${pick(COLORS)};
      border-radius: 50%;
      --sd: ${rnd(0.5,1.2)}s;
      --sdelay: ${delay}s;
      --dx: ${dx}px;
      --dy: ${dy}px;
      --ds: ${ds};
    `;
    paintEl.appendChild(el);
  }

  // ── % counter purely via setInterval ──
  const STEPS    = 200;
  const INTERVAL = TOTAL / STEPS;
  let   step     = 0;

  const timer = setInterval(()=>{
    step++;
    const pct = Math.min(Math.round((step/STEPS)*100), 100);
    pctLabel.textContent = pct + '%';
    if(pct >= 100){
      clearInterval(timer);
      // Small pause so last streams finish falling visually, then splash
      setTimeout(doSplash, 300);
    }
  }, INTERVAL);

  function doSplash(){
    // Hide % label
    pctLabel.style.display = 'none';
    // Reveal main and expand dark splash circle
    mainEl.classList.add('on');
    splash.classList.add('go');
    splash.addEventListener('animationend', ()=>{
      loaderEl.style.display = 'none';
      splash.style.display   = 'none';
      mainLogo.classList.add('in');
      if(taglineEl) taglineEl.classList.add('in');
      subBlock.classList.add('in');
    }, { once: true });
  }

})();
</script>
</body>
</html>
