<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>àbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
}

/* ════════════════════════════════
   LOADER
════════════════════════════════ */
#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#loader-bg {
  display: none;
}

/* Ink blobs — behind center, dark green */
#loader-blobs {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.blob {
  position: absolute;
  border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
  opacity: 0;
  animation: blobPop 0.5s cubic-bezier(0.34,1.4,0.64,1) forwards;
  filter: blur(1px);
}

@keyframes blobPop {
  0%   { opacity:0; transform:scale(0) rotate(var(--r)); }
  70%  { opacity:0.9; transform:scale(1.08) rotate(var(--r)); }
  100% { opacity:0.85; transform:scale(1) rotate(var(--r)); }
}

.drip {
  position: absolute;
  border-radius: 0 0 50% 50%;
  opacity: 0;
  animation: dripAnim 1s ease-in forwards;
}

@keyframes dripAnim {
  0%   { opacity:0; height:0; }
  20%  { opacity:0.8; }
  100% { opacity:0.8; height:var(--dh); }
}

/* ── SVG à fill ── */
#loader-center {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

#letter-svg {
  width: clamp(160px, 30vw, 260px);
  height: clamp(180px, 34vw, 300px);
  filter: drop-shadow(0 0 24px rgba(34,197,94,0.4));
}

#pct-label {
  font-family: 'Inter', sans-serif;
  font-size: clamp(13px, 2vw, 16px);
  font-weight: 500;
  letter-spacing: 4px;
  color: rgba(0,0,0,0.4);
}

/* ── Word assembly after 100% ── */
#word-assembly {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
}

.word-logo {
  display: flex;
  align-items: baseline;
  gap: 0;
  font-family: 'Inter', sans-serif;
  font-size: clamp(52px, 11vw, 120px);
  font-weight: 800;
  letter-spacing: -2px;
}

.wl-a {
  color: #22c55e;
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  text-shadow: 0 0 20px rgba(34,197,94,0.5);
}

.wl-tick {
  position: absolute;
  top: -0.08em;
  left: 50%;
  transform: translateX(-46%);
  width: 0.44em;
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 0 5px rgba(34,197,94,0.7));
}

.wl-tick path {
  stroke: #22c55e;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
}

/* bank24 black with white glow in assembly too */
.wl-bank {
  color: #000;
  text-shadow:
    0 0 2px rgba(255,255,255,0.95),
    0 0 12px rgba(255,255,255,0.7),
    0 0 28px rgba(255,255,255,0.3);
}

.wl-char {
  display: inline-block;
  opacity: 0;
  transform: translateY(16px);
}

/* ════════════════════════════════
   SPLASH
════════════════════════════════ */
#splash {
  position: fixed;
  inset: 0;
  z-index: 8888;
  pointer-events: none;
  clip-path: circle(0% at 50% 50%);
  background: #000;
}

#splash.go {
  animation: splashGo 0.85s cubic-bezier(0.55,0,0.1,1) forwards;
}

@keyframes splashGo {
  to { clip-path: circle(150% at 50% 50%); }
}

/* ════════════════════════════════
   MAIN PAGE
════════════════════════════════ */
#main {
  position: fixed;
  inset: 0;
  z-index: 1;
  opacity: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

#main.on { opacity: 1; }

/* ── Section 1 ── */
#s1 {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px 60px;
  position: relative;
  overflow: hidden;

  /* Background matching reference photo — dark black-green rays */
  background:
    radial-gradient(ellipse 65% 85% at 2% 98%,  rgba(0,100,22,0.6)  0%, transparent 52%),
    radial-gradient(ellipse 55% 75% at 98% 2%,  rgba(0,80,18,0.5)   0%, transparent 52%),
    radial-gradient(ellipse 45% 65% at 98% 98%, rgba(0,60,12,0.35)  0%, transparent 48%),
    radial-gradient(ellipse 35% 55% at 2%  2%,  rgba(0,50,10,0.3)   0%, transparent 48%),
    radial-gradient(ellipse 30% 40% at 50% 50%, rgba(0,30,6,0.2)    0%, transparent 60%),
    #020602;
}

/* Subtle diagonal light streaks */
#s1::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, rgba(0,120,28,0.08) 0%, transparent 40%),
    linear-gradient(315deg, rgba(0,90,18,0.06) 0%, transparent 40%);
  pointer-events: none;
}

/* Breathing green core */
#s1::after {
  content: '';
  position: absolute;
  inset: -20%;
  background: radial-gradient(ellipse 30% 30% at 50% 50%, rgba(26,122,60,0.07) 0%, transparent 70%);
  animation: breathe 5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes breathe {
  0%,100% { transform:scale(1); opacity:0.6; }
  50%      { transform:scale(1.1); opacity:1; }
}

/* ── Main Logo ── */
.main-logo {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: baseline;
  gap: 0;
  font-family: 'Inter', sans-serif;
  font-size: clamp(56px, 12vw, 140px);
  font-weight: 800;
  letter-spacing: -2px;
  cursor: default;
  user-select: none;
}

/* White radial spot BEHIND the logo text */
.logo-glow {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 130%;
  height: 160%;
  background: radial-gradient(ellipse 55% 55% at 50% 50%,
    rgba(255,255,255,0.18) 0%,
    rgba(255,255,255,0.07) 40%,
    transparent 70%);
  pointer-events: none;
  z-index: -1;
  border-radius: 50%;
}

/* Tagline */
.tagline {
  position: relative;
  z-index: 2;
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(12px, 1.6vw, 16px);
  font-weight: 300;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-top: 10px;
  cursor: default;
  transition: color 0.3s, text-shadow 0.3s;
  opacity: 0;
  transform: translateY(10px);
}

.tagline:hover {
  color: rgba(255,255,255,0.8);
  text-shadow: 0 0 16px rgba(255,255,255,0.2);
}

.tagline.in {
  animation: riseIn 0.85s cubic-bezier(0.22,1,0.36,1) 0.45s forwards;
}

.ml-a-wrap {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
}

/* SVG checkmark tick above the a — like reference logo */
.ml-tick {
  position: absolute;
  top: -0.08em;
  left: 50%;
  transform: translateX(-46%);
  width: 0.44em;
  overflow: visible;
  pointer-events: none;
  filter: drop-shadow(0 0 6px rgba(34,197,94,0.7));
}

.ml-tick path {
  stroke: #22c55e;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  animation: tickFloat 2.6s ease-in-out infinite;
  transform-origin: 50% 50%;
}

@keyframes tickFloat {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  25%     { transform: translateY(-4px) rotate(-4deg); }
  50%     { transform: translateY(-2px) rotate(3deg); }
  75%     { transform: translateY(-5px) rotate(-2deg); }
}

/* à — bright green */
.ml-a-letter {
  display: inline-block;
  color: #22c55e;
  text-shadow:
    0 0 20px rgba(34,197,94,0.55),
    0 0 50px rgba(34,197,94,0.25);
  transition: text-shadow 0.3s ease;
}

/* bank — black with white under-glow so it's visible on dark bg */
.ml-bank {
  color: #000;
  display: inline-block;
  text-shadow:
    0 0 2px rgba(255,255,255,0.95),
    0 0 12px rgba(255,255,255,0.7),
    0 0 30px rgba(255,255,255,0.35);
  transition: text-shadow 0.3s ease;
}

/* Hover glow — subtle white boost */
.main-logo:hover .ml-a-letter {
  text-shadow:
    0 0 25px rgba(34,197,94,0.8),
    0 0 60px rgba(34,197,94,0.4),
    0 0 2px rgba(255,255,255,0.3);
}

.main-logo:hover .ml-bank {
  text-shadow:
    0 0 2px rgba(255,255,255,1),
    0 0 20px rgba(255,255,255,0.9),
    0 0 50px rgba(255,255,255,0.5);
}

.main-logo:hover .ml-tick path {
  stroke: #4ade80;
  filter: drop-shadow(0 0 5px rgba(74,222,128,0.9));
}

/* ── Subtitle ── */
.subtitle-block {
  position: relative;
  z-index: 2;
  max-width: 740px;
  text-align: center;
  margin-top: 52px;
  padding: 0 16px;
}

.subtitle-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(13px, 1.8vw, 17px);
  font-weight: 300;
  color: rgba(255,255,255,0.75);
  line-height: 1.8;
  letter-spacing: 0.2px;
  cursor: default;
  transition: color 0.35s, text-shadow 0.35s;
}

.subtitle-text:hover {
  color: rgba(255,255,255,1);
  text-shadow:
    0 0 18px rgba(255,255,255,0.22),
    0 0 40px rgba(255,255,255,0.1);
}

.subtitle-text .hl {
  color: #4ade80;
  font-weight: 500;
  transition: text-shadow 0.35s;
}

.subtitle-text:hover .hl {
  text-shadow: 0 0 14px rgba(74,222,128,0.6), 0 0 30px rgba(74,222,128,0.25);
}

.divider {
  width: 48px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(34,197,94,0.5), transparent);
  margin: 28px auto;
}

.author {
  font-family: 'Inter', sans-serif;
  font-size: clamp(11px, 1.4vw, 14px);
  font-weight: 400;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  cursor: default;
  transition: color 0.3s, text-shadow 0.3s;
}

.author:hover {
  color: rgba(255,255,255,0.65);
  text-shadow: 0 0 16px rgba(255,255,255,0.18);
}

/* Reveal animations */
.main-logo, .subtitle-block {
  opacity: 0;
  transform: translateY(24px);
}

.main-logo.in {
  animation: riseIn 0.85s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
}

.subtitle-block.in {
  animation: riseIn 0.85s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
}

@keyframes riseIn {
  to { opacity:1; transform:translateY(0); }
}

/* Scroll hint */
.scroll-hint {
  position: absolute;
  bottom: 28px; left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 0;
  animation: fadeH 1s ease 1.2s forwards;
}

@keyframes fadeH { to { opacity:0.3; } }

.scroll-hint span {
  font-family:'Inter',sans-serif;
  font-size:9px; letter-spacing:4px;
  color:#22c55e; text-transform:uppercase;
}

.sh-line {
  width:1px; height:28px;
  background:linear-gradient(to bottom,rgba(34,197,94,0.8),transparent);
  animation: shPulse 1.6s ease-in-out infinite;
}

@keyframes shPulse {
  0%,100% { transform:scaleY(1); opacity:1; }
  50%      { transform:scaleY(0.5) translateY(6px); opacity:0.4; }
}

/* ── Section 2 (empty) ── */
#s2 {
  min-height: 100vh;
  background: #020602;
}
</style>
</head>
<body>

<div id="splash"></div>

<!-- ═══ LOADER ═══ -->
<div id="loader">
  <div id="loader-bg"></div>
  <div id="loader-blobs"></div>

  <!-- Filling à SVG -->
  <div id="loader-center">
    <svg id="letter-svg" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Clip that rises from bottom -->
        <clipPath id="rise">
          <rect id="riseRect" x="-10" y="230" width="220" height="0"/>
        </clipPath>
        <!-- Glow filter -->
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Outline à (always visible) — dark stroke on white bg -->
      <text
        x="100" y="205"
        text-anchor="middle"
        font-family="Inter, sans-serif"
        font-size="210"
        font-weight="800"
        fill="none"
        stroke="rgba(34,197,94,0.35)"
        stroke-width="1.5">à</text>

      <!-- Filled à (revealed bottom→top) -->
      <g clip-path="url(#rise)" filter="url(#glow)">
        <text
          x="100" y="205"
          text-anchor="middle"
          font-family="Inter, sans-serif"
          font-size="210"
          font-weight="800"
          fill="#22c55e">à</text>
      </g>
    </svg>

    <div id="pct-label">0%</div>
  </div>

  <!-- Word assembly overlay -->
  <div id="word-assembly">
    <div class="word-logo">
      <span class="wl-a">
        <svg class="wl-tick" viewBox="0 0 36 22" xmlns="http://www.w3.org/2000/svg">
          <path id="wl-tick-path" d="M4 12 L12 20 L32 4"/>
        </svg>
        <span>a</span>
      </span>
      <span class="wl-bank">
        <span class="wl-char">b</span><span class="wl-char">a</span><span class="wl-char">n</span><span class="wl-char">k</span>
      </span>
    </div>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div id="main">
  <section id="s1">

    <div class="main-logo" id="main-logo">
      <!-- White glow spot behind the whole logo -->
      <div class="logo-glow"></div>
      <span class="ml-a-wrap">
        <svg class="ml-tick" viewBox="0 0 36 22" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12 L12 20 L32 4"/>
        </svg>
        <span class="ml-a-letter">a</span>
      </span>
      <span class="ml-bank">bank</span>
    </div>
    <p class="tagline" id="tagline">цінуємо стосунки</p>

    <div class="subtitle-block" id="sub-block">
      <p class="subtitle-text">
        Шукаємо тих, хто <span class="hl">«поза зоною комфорту»</span>:<br>
        Потрібно прорахувати <span class="hl">% SL ASA</span> для всієї команди за період.<br>
        Фінальна мета&nbsp;— сформувати список <span class="hl">(ПІБ&nbsp;+&nbsp;LDAP)</span> операторів,
        які не дотягнули до таргету в&nbsp;<span class="hl">65%</span>.
      </p>
      <div class="divider"></div>
      <p class="author">Підготувала Волошко Ульяна</p>
    </div>

    <div class="scroll-hint">
      <span>scroll</span>
      <div class="sh-line"></div>
    </div>
  </section>

  <section id="s2"></section>
</div>

<script>
(function(){
  // ── constants ──
  const STEPS    = 200;
  const INTERVAL = 5000 / STEPS; // 5s total

  // ── elements ──
  const riseRect   = document.getElementById('riseRect');
  const pctLabel   = document.getElementById('pct-label');
  const blobsEl    = document.getElementById('loader-blobs');
  const loaderCtr  = document.getElementById('loader-center');
  const wordEl     = document.getElementById('word-assembly');
  const wlTickPath = document.getElementById('wl-tick-path');
  const splash     = document.getElementById('splash');
  const mainEl     = document.getElementById('main');
  const mainLogo   = document.getElementById('main-logo');
  const subBlock   = document.getElementById('sub-block');
  const loaderEl   = document.getElementById('loader');
  const taglineEl  = document.getElementById('tagline');

  // hide word-logo before animation
  const wlLogo = wordEl.querySelector('.word-logo');
  wlLogo.style.opacity = '0';

  let step = 0, lastMilestone = -1;

  function rnd(a,b){ return Math.random()*(b-a)+a; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  const BLOB_COLORS = [
    '#000a02','#001205','#001a06','#000d03',
    '#001508','#002008','#000800','#001003',
    '#002510','#000500','#001a08','#000e04',
  ];

  function spawnBlobs(count){
    const vw = window.innerWidth, vh = window.innerHeight;
    const cx = vw/2, cy = vh/2;
    const safeR = Math.min(vw,vh)*0.28;
    for(let i=0;i<count;i++){
      let x,y,t=0;
      do { x=rnd(-20,vw+20); y=rnd(-20,vh+20); t++; }
      while(t<25 && Math.hypot(x-cx,y-cy)<safeR);
      const s=rnd(60,200), c=pick(BLOB_COLORS), r=rnd(-80,80)+'deg';
      const b=document.createElement('div');
      b.className='blob';
      b.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s*rnd(0.5,1.2)}px;background:${c};--r:${r};border-radius:${rnd(30,65)}% ${rnd(35,65)}% ${rnd(30,70)}% ${rnd(35,60)}%/${rnd(35,65)}% ${rnd(30,60)}% ${rnd(40,70)}% ${rnd(30,65)}%;animation-delay:${rnd(0,0.1)}s;`;
      blobsEl.appendChild(b);
    }
  }

  // à fills to 100% when overall progress = 65%
  function setFill(pct){
    const filled = 240 * Math.min(pct/65, 1);
    riseRect.setAttribute('y', 230 - filled);
    riseRect.setAttribute('height', filled + 10);
  }

  const timer = setInterval(()=>{
    step++;
    const pct = Math.min(Math.round((step/STEPS)*100), 100);
    pctLabel.textContent = pct+'%';
    setFill(pct);
    const m = Math.floor(pct/6);
    if(m > lastMilestone){
      lastMilestone = m;
      spawnBlobs(4 + Math.floor(pct/14));
    }
    if(pct >= 100){ clearInterval(timer); onComplete(); }
  }, INTERVAL);

  function onComplete(){
    setFill(100);
    pctLabel.textContent = '100%';

    setTimeout(()=>{
      // Fade out the à letter
      loaderCtr.style.transition = 'opacity 0.2s';
      loaderCtr.style.opacity = '0';

      // Pop in word-assembly
      wordEl.style.opacity = '1';
      if(wlTickPath){
        const len = wlTickPath.getTotalLength() || 60;
        wlTickPath.style.strokeDasharray  = len;
        wlTickPath.style.strokeDashoffset = 0;
      }
      wlLogo.style.transform  = 'scale(0.55)';
      wlLogo.style.transition = 'transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        wlLogo.style.transform = 'scale(1)';
        wlLogo.style.opacity   = '1';
      }));

      setTimeout(doSplash, 750);
    }, 150);
  }

  function doSplash(){
    mainEl.classList.add('on');
    splash.classList.add('go');
    splash.addEventListener('animationend', ()=>{
      loaderEl.style.display = 'none';
      splash.style.display   = 'none';
      mainLogo.classList.add('in');
      if(taglineEl) taglineEl.classList.add('in');
      subBlock.classList.add('in');
    }, {once:true});
  }

})();
</script>
</body>
</html>
